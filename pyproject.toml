[project]
name = "cable-modem-stats"
version = "0.0.1"
description = "Collect cable modem statistics and send them to InfluxDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "influxdb-client>=1.50,<2",
    "requests>=2.34,<3",
    "urllib3>=2.7,<3",
]

[dependency-groups]
dev = [
    "codespell>=2.4,<3",
    "pre-commit>=4.6,<5",
    "pyright>=1.1,<2",
    "ruff>=0.16,<1",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "S",
    "SIM",
    "T10",
    "UP",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src"]
exclude = [".venv"]
reportMissingTypeStubs = false
